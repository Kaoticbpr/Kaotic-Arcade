# KaoticBPR Arcade loudness leveler (PipeWire filter-chain, run by arcade-leveler.sh only while ES-DE is open).
# Stage 1 (slow): EBU R128 loudness over the last 10 s (max-history is in seconds), silence gated out,
#                 steers the volume toward about -16 LUFS, limited to -9 dB .. +9 dB.
# Stage 2 (fast): if the result jumps above about -11 LUFS (400 ms window), it is turned down right away,
#                 so switching from a quiet game to a loud one never blasts. It never turns anything up.
# Note: PipeWire's meter reads stereo 3 dB low, so the Target values below are 3 dB under the real result
#       (measured: Target -19 -> -16 LUFS out). Raise both targets by the same amount to make it louder.
context.properties = {
    log.level = 0
}
context.spa-libs = {
    audio.convert.* = audioconvert/libspa-audioconvert
    support.*       = support/libspa-support
}
context.modules = [
    { name = libpipewire-module-rt args = { nice.level = -11 } flags = [ ifexists nofail ] }
    { name = libpipewire-module-protocol-native }
    { name = libpipewire-module-client-node }
    { name = libpipewire-module-adapter }
    { name = libpipewire-module-filter-chain
        args = {
            node.description = "Arcade Leveler"
            media.name       = "Arcade Leveler"
            filter.graph = {
                nodes = [
                    { type = ebur128 name = meter  label = ebur128 config = { max-history = 10.0 use-histogram = false } }
                    { type = ebur128 name = l2g    label = lufs2gain control = { "Target LUFS" = -19.0 } }
                    { type = builtin name = range  label = clamp     control = { "Min" = 0.355 "Max" = 2.818 } }
                    { type = builtin name = gainL  label = linear }
                    { type = builtin name = gainR  label = linear }
                    { type = ebur128 name = meter2 label = ebur128 }
                    { type = ebur128 name = c2g    label = lufs2gain control = { "Target LUFS" = -14.0 } }
                    { type = builtin name = ceil   label = clamp     control = { "Min" = 0.25 "Max" = 1.0 } }
                    { type = builtin name = outL   label = linear }
                    { type = builtin name = outR   label = linear }
                ]
                links = [
                    { output = "meter:Out FL"          input = "gainL:In" }
                    { output = "meter:Out FR"          input = "gainR:In" }
                    { output = "meter:Global LUFS"     input = "l2g:LUFS" }
                    { output = "l2g:Gain"              input = "range:Control" }
                    { output = "range:Notify"          input = "gainL:Mult" }
                    { output = "range:Notify"          input = "gainR:Mult" }
                    { output = "gainL:Out"             input = "meter2:In FL" }
                    { output = "gainR:Out"             input = "meter2:In FR" }
                    { output = "meter2:Out FL"         input = "outL:In" }
                    { output = "meter2:Out FR"         input = "outR:In" }
                    { output = "meter2:Momentary LUFS" input = "c2g:LUFS" }
                    { output = "c2g:Gain"              input = "ceil:Control" }
                    { output = "ceil:Notify"           input = "outL:Mult" }
                    { output = "ceil:Notify"           input = "outR:Mult" }
                ]
                inputs  = [ "meter:In FL" "meter:In FR" ]
                outputs = [ "outL:Out" "outR:Out" ]
            }
            audio.channels = 2
            audio.position = [ FL FR ]
            capture.props  = { node.name = "arcade_leveler" media.class = Audio/Sink filter.smart = true filter.smart.name = "arcade-leveler" }
            playback.props = { node.name = "arcade_leveler.output" node.passive = true }
        }
    }
]
